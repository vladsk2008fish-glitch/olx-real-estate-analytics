version: 2

models:
  - name: olx_houses
    description: "Rental apartment listings in Łódź collected from OLX"
    columns:
      - name: title
        description: "Title of the rental listing"
      - name: location
        description: "Location of the property (Łódź)"
      - name: price
        description: "Monthly rental price in PLN"
        metrics:
          avg_price:
            type: average
            description: "Average rental price"
          min_price:
            type: min
            description: "Minimum rental price"
          max_price:
            type: max
            description: "Maximum rental price"
      - name: price_category
        description: "Budget, Medium, or Premium price tier"
        metrics:
          total_listings:
            type: count
            description: "Total number of listings"